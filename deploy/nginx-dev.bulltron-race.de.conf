# /etc/nginx/sites-available/dev.bulltron-race.de
#
# Reverse Proxy vor der Next.js-Anwendung auf Port 3000.
# Nach dem Aktivieren:
#   ln -s /etc/nginx/sites-available/dev.bulltron-race.de /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dev.bulltron-race.de
# Certbot ergänzt den TLS-Block und die Weiterleitung von Port 80 selbst.

server {
    listen 80;
    listen [::]:80;
    server_name dev.bulltron-race.de;

    # Uploads im Backend: Payload lässt 10 MB zu, hier etwas Luft.
    client_max_body_size 12M;

    # Dev-Instanz gehört nicht in den Google-Index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/bulltron-race.access.log;
    error_log  /var/log/nginx/bulltron-race.error.log;

    # ---- Passwortschutz für die gesamte Dev-Instanz ----
    auth_basic "Bulltron Race — Vorschau";
    auth_basic_user_file /etc/nginx/.htpasswd-bulltron;

    # ---- Ausnahme: Stripe muss ohne Passwort zustellen können ----
    # Ohne diesen Block beantwortet nginx jeden Webhook mit 401 und Stripe
    # meldet den Endpunkt irgendwann als defekt ab.
    location = /shop/api/stripe-webhook {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Statische Next.js-Dateien dürfen lange im Cache liegen ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Alles andere an die Anwendung ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
