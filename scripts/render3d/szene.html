<title>Bulltron Race — 3D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #fff; }
  canvas { display: block; }
</style>

<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { etikettZeichnen, schriftenLaden } from './etikett.js'
import { MODELLE } from './modelle.js'

const p = new URLSearchParams(location.search)
const VARIANTE = p.get('v') || 'studio'
const MODELL = MODELLE[p.get('m') || '12ah']
const BREITE = Number(p.get('w') || 1800)
const HOEHE = Number(p.get('h') || 1350)
const WINKEL = Number(p.get('winkel') ?? 22) // Blickwinkel in Grad, 0 = frontal

/* ---------------------------------------------------------------- Maße --
   Einheit ist willkürlich; nur die Verhältnisse zählen, und die stammen aus
   den Produktfotos (siehe modelle.js). */
const B = 15
const Hges = B / MODELL.breiteZuHoehe
const T = B * MODELL.tiefeZuBreite
/* Oberkante der Vorderseite: genau dort, wo im Foto das Etikett beginnt.
   Darüber sitzt der Deckel mit den Polen. */
const KOERPER = Hges * (1 - MODELL.etikett.oben)
const DECKEL_H = Hges - KOERPER
const ROT = 0xe03e51

const ET_B = MODELL.etikett.breite * B
const ET_H = MODELL.etikett.hoehe * Hges
const ET_OBEN = Hges - MODELL.etikett.oben * Hges // Oberkante des Etiketts

const logo = new Image()
const logoBereit = new Promise((f) => { logo.onload = f; logo.onerror = f })
logo.src = 'logo.png'

/* --------------------------------------------------------------- Szene -- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(BREITE, HOEHE)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()

const stile = {
  studio: {
    hintergrund: ['#f2f3f4', '#d8dade'],
    boden: 0xe9eaec,
    toneMapping: THREE.ACESFilmicToneMapping,
    belichtung: 1.05,
    gehaeuse: { color: 0x0d0e11, roughness: 0.5, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.35 },
    lichter: 'studio',
  },
  dunkel: {
    hintergrund: ['#14181c', '#06080a'],
    boden: 0x0c1013,
    toneMapping: THREE.ACESFilmicToneMapping,
    belichtung: 1.15,
    gehaeuse: { color: 0x0f1013, roughness: 0.34, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.22 },
    lichter: 'dunkel',
  },
  flach: {
    hintergrund: ['#eceef0', '#dfe2e6'],
    boden: null,
    toneMapping: THREE.NoToneMapping,
    belichtung: 1,
    gehaeuse: { color: 0x23262b, roughness: 1, metalness: 0, toon: true },
    lichter: 'flach',
  },
}
const stil = stile[VARIANTE] ?? stile.studio

renderer.toneMapping = stil.toneMapping
renderer.toneMappingExposure = stil.belichtung
renderer.outputColorSpace = THREE.SRGBColorSpace

const hg = document.createElement('canvas')
hg.width = 8; hg.height = 512
const hgc = hg.getContext('2d')
const hgv = hgc.createLinearGradient(0, 0, 0, 512)
hgv.addColorStop(0, stil.hintergrund[0])
hgv.addColorStop(1, stil.hintergrund[1])
hgc.fillStyle = hgv
hgc.fillRect(0, 0, 8, 512)
const hgTex = new THREE.CanvasTexture(hg)
hgTex.colorSpace = THREE.SRGBColorSpace
scene.background = hgTex

if (VARIANTE !== 'flach') {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = VARIANTE === 'dunkel' ? 0.35 : 0.85
}

/* Kamera: Abstand aus der Bauteilgröße, damit jedes Modell gleich im Bild
   sitzt — unabhängig davon, ob es flach und breit oder hoch und schmal ist. */
const bogen = (g) => (g * Math.PI) / 180
const FOV = 20
const halbe = Math.sqrt(B * B + Hges * Hges + T * T) / 2
const radius = (halbe / Math.sin(bogen(FOV / 2))) * 1.06
const blick = new THREE.Vector3(0, Hges * 0.5, 0)

let camera
if (VARIANTE === 'flach') {
  const a = BREITE / HOEHE
  const s = halbe * 1.12
  camera = new THREE.OrthographicCamera(-s * a, s * a, s, -s, 0.1, radius * 4)
  camera.position.set(
    Math.sin(bogen(WINKEL)) * radius,
    blick.y + halbe * 0.34,
    Math.cos(bogen(WINKEL)) * radius,
  )
} else {
  camera = new THREE.PerspectiveCamera(FOV, BREITE / HOEHE, 0.1, radius * 4)
  camera.position.set(
    Math.sin(bogen(WINKEL)) * radius,
    blick.y + halbe * 0.28,
    Math.cos(bogen(WINKEL)) * radius,
  )
}
camera.lookAt(blick)

/* ------------------------------------------------------------ Material -- */
const rampe = () => {
  const c = document.createElement('canvas')
  c.width = 3; c.height = 1
  const g = c.getContext('2d')
  ;['#6c7076', '#b9bdc3', '#ffffff'].forEach((f, i) => { g.fillStyle = f; g.fillRect(i, 0, 1, 1) })
  const t = new THREE.CanvasTexture(c)
  t.minFilter = THREE.NearestFilter
  t.magFilter = THREE.NearestFilter
  t.colorSpace = THREE.SRGBColorSpace
  return t
}
const toonRampe = stil.gehaeuse.toon ? rampe() : null

const werkstoff = (o) => (stil.gehaeuse.toon
  ? new THREE.MeshToonMaterial({ color: o.color ?? stil.gehaeuse.color, gradientMap: toonRampe })
  : new THREE.MeshPhysicalMaterial(o))

const matGehaeuse = werkstoff({ ...stil.gehaeuse })
const matDeckel = werkstoff({ ...stil.gehaeuse, color: 0x111318, roughness: (stil.gehaeuse.roughness ?? 0.4) + 0.14, clearcoat: 0.25 })
const matDunkel = werkstoff({ ...stil.gehaeuse, color: 0x08090a, roughness: 0.7 })
const metall = (farbe) => (stil.gehaeuse.toon
  ? new THREE.MeshToonMaterial({ color: farbe, gradientMap: toonRampe })
  : new THREE.MeshPhysicalMaterial({ color: farbe, roughness: 0.2, metalness: 1 }))
const kunststoff = (farbe) => (stil.gehaeuse.toon
  ? new THREE.MeshToonMaterial({ color: farbe, gradientMap: toonRampe })
  : new THREE.MeshPhysicalMaterial({ color: farbe, roughness: 0.35, metalness: 0, clearcoat: 0.5 }))

const gruppe = new THREE.Group()
scene.add(gruppe)

/* ------------------------------------------------------------ Gehäuse --- */
const kante = B * 0.015
const koerper = new THREE.Mesh(new RoundedBoxGeometry(B, KOERPER, T, 4, kante), matGehaeuse)
koerper.position.y = KOERPER / 2
koerper.castShadow = true
koerper.receiveShadow = true
gruppe.add(koerper)

/* Umlaufende Deckelkante — im Foto ein schmaler Absatz über der Vorderseite. */
const rand = new THREE.Mesh(
  new RoundedBoxGeometry(B + kante * 1.2, DECKEL_H * 0.14, T + kante * 1.2, 3, kante * 0.45),
  matDeckel,
)
rand.position.y = KOERPER
rand.castShadow = true
gruppe.add(rand)

if (MODELL.bauart === 'moto') {
  /* Deckel der Motorrad-Baureihe, am Foto der 12 Ah abgemessen:
       - der ganze Aufbau über der Vorderseite ist 10,9 % der Gehäusehöhe hoch
       - die Polklemmen sind 9,2 % der Gehäusebreite breit, Mitte bei 10,5 %
         und 89,5 % der Breite, und schließen oben bündig mit dem Deckel ab
       - in der Mitte eine rechteckige Mulde
     Der Deckel wird deshalb als Rahmen aus vier Wänden gebaut: nur so ist die
     Mulde eine echte Vertiefung und keine aufgesetzte dunkle Fläche.         */
  const y0 = KOERPER
  const yM = KOERPER + DECKEL_H / 2

  const MULDE_B = B * 0.50
  const MULDE_T = T * 0.42

  const wand = (bx, bz, x, z) => {
    const m = new THREE.Mesh(
      new RoundedBoxGeometry(bx, DECKEL_H, bz, 3, kante * 0.5),
      matDeckel,
    )
    m.position.set(x, yM, z)
    m.castShadow = true
    m.receiveShadow = true
    gruppe.add(m)
  }
  const seite = (B * 0.99 - MULDE_B) / 2
  const tiefeVorn = (T * 0.99 - MULDE_T) / 2
  wand(B * 0.99, tiefeVorn, 0, (MULDE_T + tiefeVorn) / 2)          // vorn
  wand(B * 0.99, tiefeVorn, 0, -(MULDE_T + tiefeVorn) / 2)         // hinten
  wand(seite, MULDE_T, -(MULDE_B + seite) / 2, 0)                  // links
  wand(seite, MULDE_T, (MULDE_B + seite) / 2, 0)                   // rechts

  const boden = new THREE.Mesh(
    new THREE.BoxGeometry(MULDE_B, 0.08, MULDE_T),
    matDunkel,
  )
  boden.position.set(0, y0 + DECKEL_H * 0.52, 0)
  boden.receiveShadow = true
  gruppe.add(boden)

  /* Polklemmen, vorn bündig mit der Gehäusevorderseite */
  const POL_B = B * 0.092
  const POL_T = POL_B * 1.15
  const POL_Z = T / 2 - POL_T / 2 + 0.06
  const POL_X = B * 0.395

  const pol = (x) => {
    const block = new THREE.Mesh(
      new RoundedBoxGeometry(POL_B, DECKEL_H * 0.99, POL_T, 3, POL_B * 0.12),
      metall(0xdfe3e8),
    )
    block.position.set(x, yM, POL_Z)
    block.castShadow = true
    gruppe.add(block)

    /* Ovale Senkung mit Schraube in der Vorderseite */
    const ovalB = POL_B * 0.46
    const ovalH = DECKEL_H * 0.56
    const senkung = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 0.14, 40),
      metall(0x6b6f76),
    )
    senkung.rotation.x = Math.PI / 2
    senkung.scale.set(ovalB, 1, ovalH)
    senkung.position.set(x, yM, POL_Z + POL_T / 2 - 0.02)
    gruppe.add(senkung)

    const schraube = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 0.10, 36),
      metall(0xc6cad0),
    )
    schraube.rotation.x = Math.PI / 2
    schraube.scale.set(ovalB * 0.72, 1, ovalH * 0.72)
    schraube.position.set(x, yM, POL_Z + POL_T / 2 + 0.03)
    gruppe.add(schraube)
  }
  pol(-POL_X)
  pol(POL_X)
} else {
  /* Auto-Baureihe: Lüftungsschlitze, versenkter Tragegriff, runde Pole. */
  const deckelY = KOERPER + DECKEL_H * 0.45
  const platte = new THREE.Mesh(
    new RoundedBoxGeometry(B * 0.985, DECKEL_H * 0.9, T * 0.985, 3, kante * 0.6),
    matDeckel,
  )
  platte.position.y = deckelY
  platte.castShadow = true
  gruppe.add(platte)

  const griff = new THREE.Mesh(
    new RoundedBoxGeometry(B * 0.40, DECKEL_H * 0.35, T * 0.26, 3, kante * 0.5),
    matDunkel,
  )
  griff.position.set(0, KOERPER + DECKEL_H * 0.82, -T * 0.02)
  gruppe.add(griff)

  /* Schlitzreihe über dem Etikett */
  for (let i = 0; i < 4; i += 1) {
    const schlitz = new THREE.Mesh(
      new THREE.BoxGeometry(B * 0.17, Hges * 0.012, 0.05),
      new THREE.MeshBasicMaterial({ color: 0x050506 }),
    )
    schlitz.position.set(-B * 0.3 + i * B * 0.2, KOERPER - Hges * 0.03, T / 2 + 0.02)
    gruppe.add(schlitz)
  }

  /* Polkappen: kurze, leicht konische Hütchen — im Foto kaum höher als breit. */
  const pol = (x, farbe) => {
    const kappe = new THREE.Mesh(
      new THREE.CylinderGeometry(B * 0.045, B * 0.056, DECKEL_H * 1.05, 36),
      kunststoff(farbe),
    )
    kappe.position.set(x, KOERPER + DECKEL_H * 0.92, T * 0.10)
    kappe.castShadow = true
    gruppe.add(kappe)
  }
  pol(-B * 0.365, 0x2f86db)
  pol(B * 0.365, 0xd8232f)
}

/* ------------------------------------------------------------ Etikett --- */
await logoBereit
await schriftenLaden()

const etikettTextur = () => {
  const t = new THREE.CanvasTexture(etikettZeichnen(document.createElement('canvas'), logo, MODELL, 2600))
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 16
  return t
}

/* Unbeleuchtet, damit das Markenrot exakt trifft — beleuchtet bricht es bei
   Werten über eins aus und kippt ins Rosa. */
const etikett = new THREE.Mesh(
  new THREE.PlaneGeometry(ET_B, ET_H),
  new THREE.MeshBasicMaterial({ map: etikettTextur(), toneMapped: false }),
)
etikett.position.set(0, ET_OBEN - ET_H / 2, T / 2 + 0.012)
gruppe.add(etikett)

if (VARIANTE !== 'flach') {
  const sc = document.createElement('canvas')
  sc.width = 512; sc.height = 256
  const sg = sc.getContext('2d')
  const sv = sg.createLinearGradient(0, 256, 512, 0)
  sv.addColorStop(0, 'rgba(255,255,255,0)')
  sv.addColorStop(0.42, 'rgba(255,255,255,0.09)')
  sv.addColorStop(0.62, 'rgba(255,255,255,0.02)')
  sv.addColorStop(1, 'rgba(255,255,255,0)')
  sg.fillStyle = sv
  sg.fillRect(0, 0, 512, 256)
  const schleier = new THREE.Mesh(
    new THREE.PlaneGeometry(ET_B, ET_H),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(sc),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false,
    }),
  )
  schleier.position.copy(etikett.position)
  schleier.position.z += 0.006
  gruppe.add(schleier)
}

/* -------------------------------------------------------------- Licht --- */
const schattenLicht = (farbe, staerke, pos) => {
  const l = new THREE.DirectionalLight(farbe, staerke)
  l.position.set(...pos)
  l.castShadow = true
  l.shadow.mapSize.set(2048, 2048)
  const s = B * 1.8
  l.shadow.camera.left = -s
  l.shadow.camera.right = s
  l.shadow.camera.top = s
  l.shadow.camera.bottom = -s
  l.shadow.radius = 5
  l.shadow.bias = -0.0007
  return l
}

if (stil.lichter === 'studio') {
  scene.add(new THREE.AmbientLight(0xffffff, 0.38))
  scene.add(schattenLicht(0xffffff, 2.9, [B * 1.2, B * 1.8, B * 1.4]))
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.9)
  fill.position.set(-B * 1.5, B * 0.8, B)
  scene.add(fill)
  const rim = new THREE.DirectionalLight(0xffffff, 1.4)
  rim.position.set(-B * 0.5, B, -B * 1.6)
  scene.add(rim)
} else if (stil.lichter === 'dunkel') {
  scene.add(new THREE.AmbientLight(0xffffff, 0.22))
  scene.add(schattenLicht(0xffffff, 1.5, [B * 0.9, B * 1.6, B * 1.2]))
  const rimRot = new THREE.SpotLight(ROT, B * B * 6, B * 5, 0.75, 0.55, 2)
  rimRot.position.set(-B * 1.6, B * 0.9, -B * 0.4)
  rimRot.target.position.set(-B * 0.3, Hges * 0.4, 0)
  scene.add(rimRot, rimRot.target)
  const rimWeiss = new THREE.SpotLight(0xcfe0ff, B * B * 3, B * 5, 0.8, 0.6, 2)
  rimWeiss.position.set(B * 1.7, B, -B * 0.8)
  rimWeiss.target.position.set(B * 0.3, Hges * 0.4, 0)
  scene.add(rimWeiss, rimWeiss.target)
} else {
  scene.add(new THREE.AmbientLight(0xffffff, 0.55))
  const l1 = new THREE.DirectionalLight(0xffffff, 1.7)
  l1.position.set(B * 0.7, B * 1.5, B * 1.3)
  scene.add(l1)
  const l2 = new THREE.DirectionalLight(0xffffff, 0.55)
  l2.position.set(-B * 1.3, B * 0.4, B * 0.8)
  scene.add(l2)
}

/* --------------------------------------------------------------- Boden -- */
if (stil.boden !== null) {
  const boden = new THREE.Mesh(
    new THREE.CircleGeometry(B * 18, 96),
    new THREE.MeshStandardMaterial({ color: stil.boden, roughness: 0.72, metalness: 0 }),
  )
  boden.rotation.x = -Math.PI / 2
  boden.receiveShadow = true
  scene.add(boden)
} else {
  const c = document.createElement('canvas')
  c.width = c.height = 256
  const g = c.getContext('2d')
  const rg = g.createRadialGradient(128, 128, 10, 128, 128, 124)
  rg.addColorStop(0, 'rgba(30,35,45,0.42)')
  rg.addColorStop(1, 'rgba(30,35,45,0)')
  g.fillStyle = rg
  g.fillRect(0, 0, 256, 256)
  const fleck = new THREE.Mesh(
    new THREE.PlaneGeometry(B * 1.8, T * 2.4),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }),
  )
  fleck.rotation.x = -Math.PI / 2
  fleck.position.y = 0.01
  scene.add(fleck)
}

renderer.render(scene, camera)
window.fertig = true
</script>
